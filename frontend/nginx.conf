server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # The API, its health check and its docs are reached through the same origin,
    # so no CORS setup is needed in production.
    location ~ ^/(api/|health$|docs$|openapi\.json$) {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Single-page app: unknown paths fall back to index.html so client-side routes work.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
